<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>系统监控面板</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h2 {
            font-size: 16px;
            color: #888;
            margin-bottom: 10px;
        }
        .card .value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>系统监控面板</h1>
    <div class="cards">
        <div class="card">
            <h2>CPU 负载</h2>
            <div class="value">{{ cpu }}</div>
        </div>
        <div class="card">
            <h2>内存使用</h2>
            <div class="value">{{ memory }}</div>
        </div>
        <div class="card">
            <h2>磁盘占用</h2>
            <div class="value">{{ disk }}</div>
        </div>
    </div>
</body>
</html>
