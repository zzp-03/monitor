<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>系统监控面板</title>
    <meta http-equiv="refresh" content="30">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 200px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h2 {
            font-size: 16px;
            color: #888;
            margin-bottom: 10px;
        }
        .card .value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>系统监控面板</h1>
    <div class="cards">
        <div class="card">
            <h2>CPU 负载(一分钟）</h2>
            <div class="value">{{ cpu }}</div>
        </div>
        <div class="card">
            <h2>内存使用</h2>
            <div class="value">{{ memory }}%</div>
        </div>
        <div class="card">
            <h2>磁盘占用</h2>
            <div class="value">{{ disk }}</div>
        </div>
    </div>
    <h2 style="text-align:center; margin-top:40px;">CPU 历史趋势（最近10次）</h2>
    <canvas id="cpuChart" width="800" height="300" style="display:block; margin:20px auto;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const times = {{ times | tojson }};
        const cpus = {{ cpus | tojson }};

        const timesRev = times.reverse();
        const cpusRev = cpus.reverse();

        const ctx = document.getElementById('cpuChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: timesRev,
                datasets: [{
                    label: 'CPU 负载',
                    data: cpusRev,
                    borderColor: '#4a90e2',
                    backgroundColor: 'rgba(74,144,226,0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    </script>
    <h2 style="text-align:center; margin-top:40px;">告警历史（最近10条）</h2>
<table style="margin:20px auto; border-collapse:collapse; width:800px;">
    <tr style="background:#f0f0f0;">
        <th style="padding:10px; border:1px solid #ddd;">时间</th>
        <th style="padding:10px; border:1px solid #ddd;">类型</th>
        <th style="padding:10px; border:1px solid #ddd;">内容</th>
    </tr>
    {% for alert in alerts %}
    <tr>
        <td style="padding:10px; border:1px solid #ddd;">{{ alert.time }}</td>
        <td style="padding:10px; border:1px solid #ddd;">{{ alert.type }}</td>
        <td style="padding:10px; border:1px solid #ddd;">{{ alert.message }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
